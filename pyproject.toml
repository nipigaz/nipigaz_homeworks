[tool.poetry]
name = "homework-10-1"
version = "0.1.0"
description = ""
authors = ["Andrey <nipigaz@rambler.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
pandas = {version = "^2.2.3", extras = ["excel"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.2"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
known_first_party = "src,tests"

[tool.black]
target-version = ["py312"]
line-length = 120
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | data
  | htmlcov
)/
'''

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 120
show-source = true
extend-ignore = "E203, E701, W503"
exclude = [
    "data",
    "htmlcov",
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "migrations"
]